<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrixTerrain</title>
<link rel="manifest" href="manifeste.json">
<meta name="theme-color" content="#1f4d2c">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PrixTerrain">
<style>
  :root {
    --vert: #2f6f4f;
    --vert-clair: #eef2ef;
    --vert-vif: #2f6f4f;
    --terre: #b0741d;
    --terre-clair: #fdfaf5;
    --rouge: #a8442f;
    --encre: #16181a;
    --gris: #78807f;
    --trait: #e4e6e2;
    --fond: #ffffff;
    --carte: #ffffff;
    --panneau: #fbfbfa;
    --rail: #fafaf9;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--encre);
    background: var(--fond);
    -webkit-text-size-adjust: 100%;
  }

  /* ---- Ossature ---- */
  #entete {
    position: sticky; top: 0; z-index: 20;
    background: var(--vert); color: #fff;
    padding: calc(env(safe-area-inset-top) + .85rem) 1rem .85rem;
    display: flex; align-items: center; gap: .6rem;
  }
  #entete h1 { font-size: 1.15rem; margin: 0; font-weight: 600; color: #fff; }
  #retour {
    margin-left: auto; background: none; border: 1px solid rgba(255,255,255,.45);
    color: #fff; font-size: .92rem; font-family: inherit; border-radius: 8px;
    padding: .35rem .8rem; cursor: pointer; display: none; white-space: nowrap;
  }
  #retour:hover { background: rgba(255,255,255,.12); }
  #application {
    max-width: 40rem; margin: 0 auto;
    padding: 1rem 1rem calc(5.5rem + env(safe-area-inset-bottom));
  }
  #barre {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: none; background: var(--carte);
    border-top: 1px solid var(--trait);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #barre .onglet-bas {
    flex: 1; background: none; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: .75rem .2rem; color: var(--gris); font-size: .82rem; font-weight: 500;
  }
  #barre .onglet-bas.actif { color: var(--vert); }

  /* ---- Recherche ---- */
  .recherche { position: relative; margin-bottom: 1rem; }
  .champ-recherche {
    flex: 1; width: 100%; height: 3rem; font-size: 1.05rem; padding: 0 1rem;
    border: 1px solid var(--trait); border-radius: 10px; background: var(--carte);
    -webkit-appearance: none;
  }
  .champ-recherche:focus { outline: 2px solid var(--vert-vif); outline-offset: 1px; }
  .champ-recherche::-webkit-search-cancel-button { -webkit-appearance: none; }
  .resultats {
    margin-top: .4rem; background: var(--carte);
    border: 1px solid var(--trait); border-radius: .75rem; overflow: hidden;
  }
  .resultat {
    display: flex; flex-direction: column; gap: .1rem; width: 100%;
    text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--trait); padding: .7rem 1rem; cursor: pointer;
  }
  .resultat:last-child { border-bottom: 0; }
  .resultat-categorie { font-size: .72rem; text-transform: uppercase;
                        letter-spacing: .04em; color: var(--gris); }
  .resultat-nom { font-size: 1.02rem; color: var(--encre); }

  /* ---- Bouton principal ---- */
  .action-large {
    width: 100%; height: 3rem; font-size: 1.05rem; font-weight: 600;
    padding: 0 1.4rem; line-height: 1;
    background: var(--vert-vif); color: #fff; border: 0;
    border-radius: 10px; cursor: pointer; margin-bottom: 1.2rem;
  }
  .action-large:active { background: var(--vert); }

  /* ---- Résumé chiffré ---- */
  .resume { display: flex; gap: .6rem; margin-bottom: 1.4rem; }
  .bloc-resume {
    flex: 1; background: var(--carte); border: 1px solid var(--trait);
    border-radius: .75rem; padding: .7rem .5rem; text-align: center;
  }
  .bloc-valeur { display: block; font-size: 1.4rem; font-weight: 700; color: var(--vert); }
  .bloc-libelle { display: block; font-size: .78rem; color: var(--gris); }
  .bloc-alerte { border-color: var(--terre); }
  .bloc-alerte .bloc-valeur { color: var(--terre); }

  /* ---- Cartes ---- */
  .carte {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--carte); border: 1px solid var(--trait);
    border-radius: .75rem; padding: .8rem .9rem; margin-bottom: .6rem;
  }
  .carte:active { background: var(--vert-clair); }
  .carte-haut { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; }
  .carte-titre { font-size: 1.05rem; font-weight: 600; color: var(--encre); }
  .carte-prix { font-size: 1.05rem; font-weight: 700; color: var(--vert); white-space: nowrap; }
  .carte-compte { font-size: 1.1rem; font-weight: 700; color: var(--vert); }
  .carte-bas { display: flex; justify-content: space-between; gap: .6rem;
               margin-top: .2rem; font-size: .88rem; color: var(--gris); }
  .evolution { display: inline-block; margin-top: .45rem; font-size: .82rem; font-weight: 600; }
  .evolution.hausse { color: var(--rouge); }
  .evolution.baisse { color: var(--vert-vif); }
  .evolution.stable, .evolution.neutre { color: var(--gris); font-weight: 500; }
  .pastille-famille {
    display: inline-block; margin: .45rem .5rem 0 0; padding: .12rem .5rem;
    border-radius: 1rem; font-size: .72rem; background: var(--vert-clair); color: var(--vert);
  }
  .pastille-famille.PHYTO { background: #eef1f8; color: #2b4a8a; }
  .pastille-famille.ENGRAIS { background: var(--terre-clair); color: var(--terre); }

  /* ---- Titres et textes ---- */
  .titre-section { margin: 1.4rem 0 .7rem; font-size: .8rem; font-weight: 700;
                   text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
  .appui { font-size: .88rem; color: var(--gris); margin: .15rem 0; }
  .vide { background: var(--carte); border: 1px dashed var(--trait); border-radius: .75rem;
          padding: 1.2rem; text-align: center; color: var(--gris); }
  .aucune { margin: 0; padding: .8rem 1rem; color: var(--gris); }

  /* ---- Formulaires ---- */
  .champ { margin-bottom: 1.1rem; }
  .etiquette { display: block; font-size: .88rem; font-weight: 600; margin-bottom: .35rem; }
  .saisie {
    width: 100%; font-size: 1.05rem; padding: .8rem .9rem;
    border: 1px solid var(--trait); border-radius: .6rem; background: var(--carte);
  }
  .saisie:focus { outline: 2px solid var(--vert-vif); outline-offset: 1px; }
  .ligne-prix { display: flex; align-items: center; gap: .5rem; }
  .ligne-prix .saisie { flex: 1; }
  .choix-unite { width: auto; min-width: 7.5rem; flex: 0 0 auto; }
  .choix-fait { display: flex; align-items: center; justify-content: space-between; gap: .75rem;
                border: 1px solid var(--trait); border-radius: .6rem;
                padding: .8rem .9rem; background: var(--vert-clair); }
  .choix-nom { font-size: 1.02rem; font-weight: 600; }
  .propositions { margin-top: .4rem; background: var(--carte);
                  border: 1px solid var(--trait); border-radius: .6rem; overflow: hidden; }
  .proposition { display: block; width: 100%; text-align: left; background: none; border: 0;
                 border-bottom: 1px solid var(--trait); padding: .75rem .9rem;
                 font-size: 1rem; cursor: pointer; color: var(--encre); }
  .proposition:last-child { border-bottom: 0; }
  .creation { color: var(--vert-vif); background: var(--fond); font-weight: 600; }
  .lien { background: none; border: 0; color: var(--vert-vif); font-size: 1rem;
          text-decoration: underline; cursor: pointer; padding: .4rem 0; }
  .details { margin: 0 0 1rem; }
  .repli { border-left: 3px solid var(--trait); padding-left: .9rem; margin-bottom: 1rem; }
  .enregistrer { width: 100%; font-size: 1.1rem; font-weight: 600; padding: .95rem;
                 background: var(--vert-vif); color: #fff; border: 0;
                 border-radius: .75rem; cursor: pointer; }
  .enregistrer:active { background: var(--vert); }
  .bouton-etroit { width: auto; padding: .7rem 1.1rem; font-size: 1rem; }
  .etiquette-case { font-size: 1rem; }

  /* ---- Messages ---- */
  .alerte { background: var(--terre-clair); border-left: 4px solid var(--terre);
            border-radius: .4rem; padding: .75rem .9rem; margin: 0 0 .9rem; }
  .confirmation { background: var(--vert-clair); border-left: 4px solid var(--vert-vif);
                  border-radius: .4rem; padding: .75rem .9rem; margin: 0 0 .9rem; }
  .attente { color: var(--terre); font-size: .9rem; margin: .25rem 0 0; }
  .manquant { background: var(--terre-clair); border-left: 4px solid #a08a5a;
              border-radius: .4rem; padding: .7rem .9rem; margin-bottom: .8rem; }
  .manquant-nom { margin: 0; font-weight: 600; }
  .manquant-suite { margin: .2rem 0 0; color: var(--gris); font-size: .9rem; }

  /* ---- Blocs de consultation ---- */
  .groupe { background: var(--carte); border: 1px solid var(--trait);
            border-radius: .75rem; padding: .8rem .9rem; margin-bottom: .8rem; }
  .titre-bloc { margin: 0 0 .5rem; font-weight: 600; }
  .valeur-moyenne { margin: 0 0 .6rem; font-size: 1.05rem; color: var(--vert); font-weight: 600; }
  .valeur-absente { margin: 0 0 .6rem; color: var(--terre); }
  .liste-releves { margin: 0; padding-left: 1.1rem; font-size: .95rem; }
  .liste-releves li { margin-bottom: .3rem; }
  .liste-releves li.atypique { color: var(--terre); }
  .marque { font-weight: 600; }
  .entete-produit { margin-bottom: 1rem; }
  .entete-produit h2 { margin: 0; font-size: 1.3rem; }
  .ligne-fiche { display: flex; align-items: center; justify-content: space-between;
                 gap: .75rem; padding: .35rem 0; }
  .onglets { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .onglet { background: var(--carte); border: 1px solid var(--trait); border-radius: 1.2rem;
            padding: .45rem .9rem; font-size: .95rem; cursor: pointer; color: var(--gris); }
  .onglet.actif { background: var(--vert); border-color: var(--vert); color: #fff; }
  .bloc-courbe { margin: 1.2rem 0; }
  .courbe { width: 100%; height: auto; background: var(--carte);
            border: 1px solid var(--trait); border-radius: .75rem; }
  .legende { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: .4rem; font-size: .9rem; }
  .legende-entree { display: flex; align-items: center; gap: .35rem; }
  .pastille { width: .8rem; height: .8rem; border-radius: 50%; display: inline-block; }
  .pied-reglages { margin-top: 1.5rem; }

  /* ---- Saisie en série ---- */
  .barre-rapide { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; align-items: end;
    padding: .9rem; background: var(--panneau); border: 1px solid var(--trait);
    border-radius: 10px; margin-bottom: 1rem; }
  .barre-rapide .case-large { grid-column: 1 / -1; }
  .barre-rapide .etiquette { font-size: .78rem; }
  .barre-rapide .saisie { height: 2.7rem; font-size: .95rem; }
  .barre-rapide .propositions { position: relative; z-index: 3; }
  .ajouter { grid-column: 1 / -1; height: 3rem; background: var(--vert); color: #fff;
    border: 0; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
    font-family: inherit; }
  .rappel { background: var(--vert-clair); border-radius: 8px; padding: .65rem .85rem;
    font-size: .9rem; margin: 0 0 1rem; color: #1f4d38; line-height: 1.5; }
  .creation-produit { background: var(--terre-clair); border: 1px solid #ead9bd;
    border-radius: 10px; padding: .8rem .9rem; margin: 0 0 1rem; }
  .creation-titre { margin: 0 0 .7rem; font-size: .9rem; color: #7a5410; }
  .creation-lignes { display: grid; grid-template-columns: 1fr; gap: .6rem; }
  .actions { display: flex; flex-direction: column; gap: .8rem; align-items: center;
    margin-top: 1.6rem; padding-top: 1.2rem; border-top: 1px solid var(--trait); }
  .fin-session { display: block; margin: 0 auto; background: none; border: 0;
    color: var(--vert); font-size: 1rem; text-decoration: underline; cursor: pointer;
    font-family: inherit; padding: .5rem .4rem; }

  /* ---- Fiche produit ---- */
  #application.ecran-fiche { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  #application.ecran-fiche > .entete-fiche,
  #application.ecran-fiche > .chiffre-principal,
  #application.ecran-fiche > .actions-fiche,
  #application.ecran-fiche > .manquant,
  #application.ecran-fiche > .onglets-fiche { flex: 0 0 auto; }
  .entete-fiche { margin-bottom: .6rem; }
  .entete-fiche h2 { margin: 0; font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
  .surtitre { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase;
              color: var(--gris); margin: 0 0 .1rem; }
  .sous-titre { font-size: .82rem; color: var(--gris); margin: .1rem 0 0; }
  .chiffre-principal { background: var(--vert-clair); border-radius: 10px;
                       padding: .7rem 1rem .75rem; margin-bottom: .7rem; }
  .chiffre-principal.absent { background: var(--terre-clair); border: 1px dashed #ead9bd; }
  .cp-question { margin: 0; font-size: .88rem; color: #3d6b55; }
  .chiffre-principal.absent .cp-question { color: var(--terre); }
  .cp-valeur { margin: .05rem 0 .35rem; font-size: 2.2rem; font-weight: 700; line-height: 1.05;
               color: #1f4d38; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .cp-unite { font-size: 1.1rem; font-weight: 500; color: #3d6b55; }
  .cp-valeur-absente { margin: .15rem 0 .3rem; font-size: 1.3rem; font-weight: 700; color: var(--terre); }
  .cp-appui { margin: 0; font-size: .9rem; color: #7a5410; }
  .cp-pastilles { display: flex; flex-wrap: wrap; gap: .3rem; }
  .cp-pastille { border: 1px solid #c3ddd0; border-radius: 1rem; padding: .1rem .6rem;
                 font-size: .78rem; color: #3d6b55; }
  .cp-meilleur { margin: .6rem 0 0; padding-top: .5rem; font-size: .88rem;
                 border-top: 1px solid #c3ddd0; color: #3d6b55; }
  .chiffre-principal.absent .cp-meilleur { border-top-color: #ead9bd; color: var(--gris); }
  .cp-meilleur-etq { color: #3d6b55; }
  .cp-meilleur b { font-weight: 700; color: #1f4d38; }
  .onglets-fiche { display: flex; gap: 1.4rem; border-bottom: 1px solid var(--trait);
                   margin-bottom: .7rem; overflow-x: auto;
                   scrollbar-width: none; -ms-overflow-style: none; }
  .onglets-fiche::-webkit-scrollbar { display: none; }
  .onglets-fiche button { background: none; border: 0; border-bottom: 2px solid transparent;
    margin-bottom: -1px; padding: .4rem 0 .5rem; font-size: .92rem; color: var(--gris);
    cursor: pointer; font-family: inherit; white-space: nowrap; }
  .onglets-fiche button.on { border-bottom-color: var(--vert); color: var(--vert); font-weight: 600; }

  .ecran-fiche .tableau-prix .rangee {
    border: 1px solid var(--trait); border-radius: 10px; margin-bottom: .5rem;
    padding: .65rem .8rem; row-gap: .25rem;
  }
  .ecran-fiche .tableau-prix .rangee.mieux { border-color: var(--vert); background: var(--vert-clair); }
  .ecran-fiche .tableau-prix .rangee.attention { border-color: #ead9bd; background: var(--terre-clair); }
  .ecran-fiche .tableau-prix .rangee.perime { background: var(--panneau); }
  .rangee.perime .col-produit, .rangee.perime .col-prix { color: var(--gris); font-weight: 500; }
  .note-perimes { margin: .6rem 0 0; font-size: .82rem; color: var(--gris); line-height: 1.5; }
  .cp-pastille.peu { border-color: #ead9bd; background: var(--terre-clair); color: var(--terre);
                     font-weight: 600; }
  .actions-fiche { margin-bottom: .7rem; }
  .action-fiche { width: 100%; background: #fff; border: 1px solid var(--vert);
                  color: var(--vert); border-radius: 8px; padding: .6rem 1rem;
                  font-size: .95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .action-fiche:hover { background: var(--vert-clair); }
  .ecran-fiche .tableau-prix .rangee .col-produit { font-size: 1rem; }
  .ecran-fiche .tableau-prix .rangee .col-prix { font-size: 1.12rem; font-weight: 700; }

  /* ---- Accueil : recherche plein écran ---- */
  .recherche { position: relative; display: flex; gap: .6rem; align-items: center; }
  .annuler { display: none; background: none; border: 0; color: var(--vert); font-size: .95rem;
             font-family: inherit; cursor: pointer; white-space: nowrap; padding: 0 .2rem; }
  .en-recherche .annuler { display: block; }
  .en-recherche .action-large { display: none; }
  .ecran-resultats { margin-top: .4rem; }
  .zone-defilante { overflow-y: auto; overflow-x: hidden; }
  #application.ecran-accueil { display: flex; flex-direction: column; overflow: hidden;
                               min-height: 0; }
  #application.ecran-accueil > .barre-haute { flex: 0 0 auto; }
  #application.ecran-accueil > .ecran-resultats { flex: 1 1 auto; min-height: 0; }
  .page-accueil { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .page-accueil > .alerte-attente,
  .page-accueil > .titre-section,
  .page-accueil > .sel-onglets { flex: 0 0 auto; }
  .ligne-resultat { display: flex; width: 100%; text-align: left; cursor: pointer; gap: 1rem;
    align-items: center; justify-content: space-between; background: none; border: 0;
    border-top: 1px solid var(--trait); padding: .8rem .3rem; font-family: inherit; }
  .ligne-resultat:last-of-type { border-bottom: 1px solid var(--trait); }
  .ligne-resultat:hover { background: var(--panneau); }
  .res-gauche { display: block; flex: 1 1 auto; min-width: 0; }
  .res-droite { display: block; flex: 0 0 auto; text-align: right; white-space: nowrap; }
  .res-nom { display: block; font-size: 1.02rem; font-weight: 600; color: var(--encre);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-appui { display: block; font-size: .82rem; color: var(--gris); margin-top: .1rem;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res-prix { display: block; font-size: 1.05rem; color: var(--vert); font-weight: 600; }
  .acces { display: block; width: 100%; text-align: left; cursor: pointer; margin-top: .6rem;
    background: var(--carte); border: 1px solid var(--trait); border-radius: 10px;
    padding: .85rem 1rem; font-size: 1rem; font-family: inherit; color: var(--encre); }

  /* ---- Accueil : alerte, onglets, tableau ---- */
  .alerte-attente {
    display: flex; align-items: center; gap: .7rem;
    background: var(--terre-clair); border: 1px solid #ead9bd; border-radius: 10px;
    padding: .7rem .9rem; margin-bottom: 1.5rem; font-size: .9rem; color: #7a5410;
  }
  .alerte-attente-nombre { font-size: 1.25rem; font-weight: 700; color: var(--terre); }

  .sel-onglets {
    display: flex; gap: 1.5rem; border-bottom: 1px solid var(--trait);
    margin-bottom: 1rem; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .sel-onglets::-webkit-scrollbar { display: none; }
  .sel-onglets button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    padding: .5rem 0 .6rem; font-size: .95rem; color: var(--gris); cursor: pointer;
    white-space: nowrap;
  }
  .sel-onglets button.on { border-bottom-color: var(--vert); color: var(--vert); font-weight: 600; }

  .tableau-prix { width: 100%; }
  .rangee {
    display: grid; width: 100%; text-align: left; background: none; border: 0;
    border-top: 1px solid var(--trait); cursor: pointer;
    grid-template-columns: minmax(0, 1fr) auto; row-gap: .15rem; column-gap: .8rem;
    align-items: center; padding: .75rem .5rem;
    font-family: inherit; font-size: .95rem; color: var(--encre);
  }
  .rangee:hover { background: var(--panneau); }
  .tableau-prix .rangee:last-child { border-bottom: 1px solid var(--trait); }
  .rangee.entete { display: none; }
  .tableau-prix .rangee.entete { position: sticky; top: 0; z-index: 2; background: var(--vert-clair); }
  .rangee.entete .tri { display: inline-flex; align-items: center; gap: .32rem;
                        cursor: pointer; user-select: none; }
  .rangee.entete .tri-ic { display: inline-flex; line-height: 0; }
  .rangee.entete .actif { color: var(--vert); }
  .col-meta { display: flex; gap: .4rem; grid-row: 2; grid-column: 1; }
  .col-produit {
    grid-row: 1; grid-column: 1; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .col-fournisseur, .col-date { color: var(--gris); font-size: .85rem; }
  .col-prix {
    grid-row: 1; grid-column: 2; text-align: right; font-size: 1.02rem;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .col-evolution {
    grid-row: 2; grid-column: 2; text-align: right; font-size: .85rem;
    font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .unite-discrete { color: var(--gris); font-size: .85rem; font-weight: 400; }
  .hausse { color: var(--rouge); }
  .baisse { color: var(--vert); }

  /* ---- Grilles de cartes ---- */

  /* ---- Ordinateur : le menu passe à gauche, le contenu s'étale ---- */

    .rangee.entete {

  /* ---- Grand écran : trois colonnes de cartes ---- */

  /* ---- Outils ---- */

  .avant { margin: .18rem 0 0; font-size: .77rem; color: var(--gris); }

  .note { background: var(--panneau); border: 1px solid var(--trait); border-radius: 8px;

  /* ---- listes et pastilles ---- */
  .ligne-nom { display: block; font-weight: 600; }

                 margin-top: .1rem; }

  /* ---- vider l'appareil ---- */

  .depuis { font-size: .86rem; color: var(--gris); }
  .depuis.vieux { color: var(--terre); font-weight: 600; }
  .note-activite { background: var(--panneau); border-left: 3px solid var(--trait);

<script>
// Retient l'invitation d'installation du navigateur pour l'écran Compte.
window.PrixTerrainInstallation = { invite: null };
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  window.PrixTerrainInstallation.invite = e;
});

// Garde une copie de l'application sur l'appareil, pour l'ouvrir sans réseau.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>

<script>
// PrixTerrain — ouverture de session et passage d'un écran à l'autre.
(function () {
  'use strict';
  var A = window.PrixTerrain;
  var zone = document.getElementById('application');
  var entete = document.getElementById('entete');
  var titre = document.getElementById('titre');
  var retour = document.getElementById('retour');
  var barre = document.getElementById('barre');

  function echapper(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ---------------------------------------------------------------------
  // Ouverture de session
  // ---------------------------------------------------------------------
  function ecranSession(alerte) {
    barre.style.display = 'none';
    retour.style.display = 'none';
    titre.textContent = 'PrixTerrain';
    zone.innerHTML =
      '<p class="appui">Relevé et suivi des prix d\'intrants agricoles.</p>' +
      (alerte ? '<p class="alerte">' + echapper(alerte) + '</p>' : '') +
      '<div class="champ"><span class="etiquette">Votre adresse</span>' +
      '<input class="saisie" type="email" id="adresse" autocomplete="username"></div>' +
      '<div class="champ"><span class="etiquette">Votre mot de passe</span>' +
      '<input class="saisie" type="password" id="motdepasse" autocomplete="current-password"></div>' +
      '<button class="enregistrer" id="entrer">Entrer</button>' +
      '<p class="manquant-suite">Mot de passe oublié ou perdu : demandez-en un nouveau au ' +
      'responsable de l\'application. Aucun courriel n\'est envoyé par PrixTerrain.</p>';

    var champAdresse = document.getElementById('adresse');
    var champMotDePasse = document.getElementById('motdepasse');
    var boutonEntrer = document.getElementById('entrer');

    champMotDePasse.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') boutonEntrer.click();
    });

    boutonEntrer.addEventListener('click', function () {
      var adresse = champAdresse.value.trim();
      var motDePasse = champMotDePasse.value;
      if (!adresse || !motDePasse) { ecranSession('Entrez votre adresse et votre mot de passe.'); return; }
      if (!navigator.onLine) {
        ecranSession("Pas de réseau pour l'instant. La première ouverture de session en demande.");
        return;
      }

      boutonEntrer.disabled = true;
      boutonEntrer.textContent = 'Un instant…';

      A.base.auth.signInWithPassword({ email: adresse, password: motDePasse })
        .then(function (r) {
          if (r.error) throw r.error;
          return A.base.from('profil').select('*').eq('id', r.data.user.id).limit(1)
            .then(function (f) {
              if (f.error) throw f.error;
              return { utilisateur: r.data.user, fiche: f.data[0] || null };
            });
        })
        .then(function (retour) {
          if (retour.fiche) return entrer(retour.fiche);
          return ecranPremiereFois(retour.utilisateur);
        })
        .catch(function (erreur) { ecranSession(A.messageSimple(erreur)); });
    });
  }

  // Première ouverture d'un compte : la fiche de conseiller se crée ici.
  function ecranPremiereFois(utilisateur) {
    titre.textContent = 'Bienvenue';
    zone.innerHTML =
      '<p>Votre nom apparaîtra à côté des relevés que vous saisirez, ' +
      'pour que l\'équipe sache qui a relevé quel prix.</p>' +
      '<div class="champ"><span class="etiquette">Votre nom et prénom</span>' +
      '<input class="saisie" type="text" id="nom" placeholder="Marie Dupont"></div>' +
      '<p class="alerte" id="alerte-nom" style="display:none"></p>' +
      '<button class="enregistrer" id="valider">Continuer</button>';

    var alerte = document.getElementById('alerte-nom');
    document.getElementById('valider').addEventListener('click', function () {
      var nom = document.getElementById('nom').value.trim();
      if (nom.length < 3) {
        alerte.textContent = 'Entrez votre nom et votre prénom.';
        alerte.style.display = 'block';
        return;
      }
      var bouton = this;
      bouton.disabled = true;
      bouton.textContent = 'Un instant…';

      A.base.from('profil')
        .insert({ id: utilisateur.id, nom: nom, courriel: utilisateur.email })
        .select()
        .then(function (r) {
          if (r.error) throw r.error;
          return entrer(r.data[0]);
        })
        .catch(function (erreur) {
          bouton.disabled = false;
          bouton.textContent = 'Continuer';
          alerte.textContent = A.messageSimple(erreur);
          alerte.style.display = 'block';
        });
    });
  }

  function entrer(fiche) {
    return A.memoriserCompte(fiche).then(function () {
      A.demarrerSynchronisation();
      demarrerApplication(fiche);
      return A.synchroniser().then(function () { return rafraichirCompte(fiche); });
    });
  }

  function rafraichirCompte(fiche) {
    return A.bd.profil.get(fiche.id).then(function (aJour) {
      if (!aJour) return;
      if (aJour.role === fiche.role && aJour.nom === fiche.nom && aJour.actif === fiche.actif) return;
      return A.memoriserCompte(aJour).then(function () { demarrerApplication(aJour); });
    });
  }

  // ---------------------------------------------------------------------
  // Navigation
  // ---------------------------------------------------------------------
  var ECRANS = {
    accueil:      { titre: 'Accueil',       afficher: function (z, c) { return A.afficherAccueil(z, c); } },

    outils:       { titre: 'Outils',        afficher: function (z, c) { return A.afficherOutils(z, c); } },
    releves:      { titre: 'Relevés',       afficher: function (z, c) { return A.afficherReleves(z, c); } },
    'a-relever':  { titre: 'Produits à relever', afficher: function (z, c) { return A.afficherARelever(z, c); } },
    vider:        { titre: 'Vider cet appareil', afficher: function (z, c) { return A.afficherVider(z, c); } },
    activite:     { titre: 'Activité de l\'équipe', afficher: function (z, c) { return A.afficherActivite(z, c); } },
    programme:    { titre: 'Mes programmes', afficher: function (z, c) { return A.afficherProgrammes(z, c); } },
    'programme-detail':  { titre: 'Programme', afficher: function (z, c, p) { return A.afficherProgrammeDetail(z, c, p); } },
    'programme-passage': { titre: 'Passage',   afficher: function (z, c, p) { return A.afficherProgrammePassage(z, c, p); } },
    compte:       { titre: 'Mon compte',    afficher: function (z, c) { return A.afficherComptes(z, c); } },
    saisie:       { titre: 'Saisir un prix', afficher: function (z, c, p) { return A.afficherSaisie(z, c, p); } },
    produit:      { titre: 'Fiche produit', afficher: function (z, c, p) { return A.afficherFicheProduit(z, c, p); } },
    fournisseur:  { titre: 'Fiche fournisseur', afficher: function (z, c, p) { return A.afficherFicheFournisseur(z, c, p); } },
    export:       { titre: 'Export tableur', afficher: function (z, c) { return A.afficherExport(z, c); } },
    doublons:     { titre: 'Fiches en double', afficher: function (z, c) { return A.afficherRapprochement(z, c); } },
    reglages:     { titre: 'Réglages',      afficher: function (z, c) { return A.afficherReglages(z, c); } }
  };

  var ONGLETS = ['accueil', 'outils', 'compte'];
  var LIBELLES_ONGLETS = { accueil: 'Accueil', outils: 'Outils', compte: 'Compte' };

  var compteCourant = null;
  var ongletCourant = 'accueil';
  var pile = [];
  var choix = {};
  var LARGE = 900;

  function estLarge() { return window.innerWidth >= LARGE; }

  function naviguer(nom, parametres) {
    if (ONGLETS.indexOf(nom) >= 0) { ongletCourant = nom; pile = []; }
    else pile.push({ nom: nom, parametres: parametres || {} });
    dessiner();
  }

  function revenir() {
    pile.pop();
    dessiner();
  }

  function dessiner() {
    var courant = pile.length ? pile[pile.length - 1] : { nom: ongletCourant, parametres: {} };
    var ecran = ECRANS[courant.nom];

    titre.textContent = courant.parametres.fiche ? courant.parametres.fiche.nom : ecran.titre;
    retour.style.display = pile.length ? 'block' : 'none';
    barre.style.display = 'flex';

    barre.innerHTML = '';
    ONGLETS.forEach(function (nom) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'onglet-bas' + (nom === ongletCourant ? ' actif' : '');
      b.textContent = LIBELLES_ONGLETS[nom];
      b.addEventListener('click', function () { naviguer(nom); });
      barre.appendChild(b);
    });

    zone.innerHTML = '';
    entete.scrollIntoView({ block: 'start' });

    if (!ecran.duo) { ecran.afficher(zone, compteCourant, courant.parametres); return; }

    // Liste et détail : côte à côte sur grand écran, l'un après l'autre sinon.
    var duo = document.createElement('div');
    duo.className = 'duo';
    var panneauListe = document.createElement('div');
    panneauListe.className = 'duo-liste';
    var panneauDetail = document.createElement('div');
    panneauDetail.className = 'duo-detail';
    duo.appendChild(panneauListe);
    duo.appendChild(panneauDetail);
    zone.appendChild(duo);

    function choisir(fiche) {
      choix[courant.nom] = fiche;
      if (estLarge()) {
        ecran.liste(panneauListe, compteCourant, choisir, fiche);
        ecran.detail(panneauDetail, compteCourant, { fiche: fiche });
      } else {
        naviguer(ecran.duo, { fiche: fiche });
      }
    }

    var retenu = estLarge() ? choix[courant.nom] : null;
    ecran.liste(panneauListe, compteCourant, choisir, retenu);
    if (retenu) ecran.detail(panneauDetail, compteCourant, { fiche: retenu });
    else if (estLarge()) {
      var vide = document.createElement('p');
      vide.className = 'vide';
      vide.textContent = 'Choisissez une fiche dans la liste pour voir ses prix.';
      panneauDetail.appendChild(vide);
    }
  }

  // Le passage entre téléphone et ordinateur redessine l'écran courant.
  var largeAvant = estLarge();
  window.addEventListener('resize', function () {
    if (estLarge() === largeAvant) return;
    largeAvant = estLarge();
    if (compteCourant) dessiner();
  });

  retour.addEventListener('click', revenir);

  // Écran Outils : porte d'entrée vers les pages qui ne méritent pas un onglet.

  function demarrerApplication(compte) {
    compteCourant = compte;
    ongletCourant = 'accueil';
    pile = [];
    dessiner();
  }

  // Une zone intérieure prend la hauteur restante ; la page cesse alors de défiler.
  var aAjuster = [];
  var observateur = null;

  function ajusterHauteurs() {
    var barreEl = document.getElementById('barre');
    var style = getComputedStyle(barreEl);
    var barreBasse = (style.position === 'fixed' && style.bottom === '0px')
      ? barreEl.offsetHeight : 0;
    var limite = window.innerHeight - barreBasse;

    aAjuster.forEach(function (zoneEl) {
      if (!zoneEl.isConnected || !zoneEl.offsetParent) { zoneEl.style.maxHeight = ''; return; }
      var haut = zoneEl.getBoundingClientRect().top;
      var place = limite - haut - 8;
      // En dessous de 240 pixels une zone n'est plus lisible : on rend la main
      // au défilement de la page plutôt que d'écraser le contenu.
      if (place < 240) { zoneEl.style.maxHeight = ''; verrouiller(false); return; }
      zoneEl.style.maxHeight = place + 'px';
    });
  }

  function suivreHauteur(zoneEl) {
    zoneEl.classList.add('zone-defilante');
    aAjuster.push(zoneEl);
    // Les écrans remplissent leur zone après avoir lu la base : on refait la
    // mesure à chaque changement, sans que chacun ait à y penser.
    if (observateur) observateur.observe(zoneEl, { childList: true, subtree: true });
  }

  if (window.MutationObserver) {
    observateur = new MutationObserver(function () {
      clearTimeout(observateur.minuterie);
      observateur.minuterie = setTimeout(ajusterHauteurs, 60);
    });
  }
  function verrouiller(actif) {
    document.documentElement.style.overflow = actif ? 'hidden' : '';
    document.body.style.overflow = actif ? 'hidden' : '';
    zone.style.overflow = actif ? 'hidden' : '';
  }
  window.addEventListener('resize', ajusterHauteurs);

  A.naviguer = naviguer;
  A.revenir = revenir;
  A.ajusterHauteurs = ajusterHauteurs;
  A.suivreHauteur = suivreHauteur;

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  if (!A.configurationComplete) {
    zone.innerHTML = '<p class="alerte">L\'adresse de la base d\'équipe n\'est pas renseignée sur cet appareil.</p>';
    return;
  }

  A.compteLocal().then(function (compte) {
    if (!compte) { ecranSession(null); return; }
    A.demarrerSynchronisation();
    demarrerApplication(compte);
    rafraichirCompte(compte);
  }).catch(function () {
    zone.innerHTML = '<p class="alerte">Cet appareil refuse de conserver les saisies. ' +
                     'Ouvrez l\'application depuis son adresse internet plutôt que depuis un fichier.</p>';
  });
})();
</script>
